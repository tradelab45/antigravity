<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RupeeRookie — Indian Paper Trading Simulator & Academy</title>
    <meta name="description" content="Learn Indian markets with ₹10 lakh in virtual capital, paper trading, market replay, lessons, risk tools, and AI-powered explanations." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RupeeRookie" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />

    <meta property="og:description" content="Practise Indian market investing with virtual capital, guided lessons, risk tools, and no real money at stake." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  
    <script>
      // Apply the saved theme and background palette before first paint so the
      // page never flashes the default canvas on load.
      try {
        const storedTheme = localStorage.getItem('rupeeRookie_theme') || localStorage.getItem('tradeLab_theme');
        if (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        const palettes = ['classic', 'midnight', 'forest', 'sunrise', 'ocean', 'plum', 'mono'];
        const storedPalette = localStorage.getItem('rupeeRookie_palette');
        document.documentElement.dataset.rrPalette = palettes.indexOf(storedPalette) >= 0 ? storedPalette : 'classic';
      } catch (error) {
        document.documentElement.dataset.rrPalette = 'classic';
      }
    </script>
  </head>
  <body class="text-slate-900 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
